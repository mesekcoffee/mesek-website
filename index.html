<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="Favicon.png">
<title>Mesek Coffee | Premium Ground Coffee</title>
  
<meta name="description" content="Mesek Coffee offers premium ground coffee inspired by coffee traditions from around the world. Discover rich flavor, aroma, and thoughtfully crafted coffee."> 

<meta name="robots" content="index, follow"> 

<link rel="canonical" href="https://mesekcoffee.com/">

<style>
html,body{
margin:0;
padding:0;
background:#f8f4ed;
}

img{
width:100%;
height:auto;
display:block;
}

.landing-page {
    position: relative;
    width: 100%;
}

.hotspot {
    position: absolute;
    top: 1.8%;
    height: 3.5%;
    z-index: 10;
    cursor: pointer;
}

.home {
    left: 30%;
    width: 8%;
}

.story {
    left: 39%;
    width: 12%;
}

.coffee {
    left: 51%;
    width: 10%;
}

.contact {
    left: 62%;
    width: 10%;
}

html {
    scroll-behavior: smooth;
}

.scroll-target {
    position: absolute;
    left: 0;
    width: 1px;
    height: 1px;
}

.coffee-target {
    top: 18%;
}

.story-target {
    top: 64%;
}

.contact-target {
    top: 90%;
}
  
</style>

</head>

<body>

<div class="landing-page">

    <img src="Landing-Page.png" alt="Mesek Coffee">

<div id="coffee" class="scroll-target coffee-target"></div>
<div id="story" class="scroll-target story-target"></div>
<div id="contact" class="scroll-target contact-target"></div>

    <a class="hotspot home" href="/" aria-label="Home"></a>
    <a class="hotspot story" href="#story" aria-label="Our Story"></a>
    <a class="hotspot coffee" href="#coffee" aria-label="Coffee"></a>
    <a class="hotspot contact" href="#contact" aria-label="Contact"></a>

</div>

</body>
</html>
